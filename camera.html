<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Pro - Foto</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    font-family: Arial, Helvetica, sans-serif;
    background: #f2f2f2;
    text-align: center;
  }
  h2 { margin: 0 0 15px 0; }
  video, img {
    width: 100%;
    max-width: 640px;
    border-radius: 12px;
    background: #000;
  }
  button {
    font-size: 18px;
    padding: 14px 26px;
    margin: 12px 6px 0 6px;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    color: #fff;
    background: #1a73e8;
  }
  button.green { background: #0a8f3c; }
  button.grey { background: #666; }
  #message { color: #d93025; min-height: 24px; margin-top: 12px; }
  .hidden { display: none; }
</style>
</head>
<body>

<h2>📷 Tirar uma foto</h2>

<video id="video" autoplay playsinline muted></video>
<img id="apercu" class="hidden" alt="Foto">

<div id="message"></div>

<div id="etapeCapture">
  <button id="btnCapturer" class="green">📸 Capturar</button>
  <button id="btnFermer" class="grey">Cancelar</button>
</div>

<div id="etapeValidation" class="hidden">
  <button id="btnUtiliser" class="green">✅ Usar esta foto</button>
  <button id="btnRepeter" class="grey">🔄 Repetir</button>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
var flux = null;
var photo = "";

function afficherMessage(texte) {
  document.getElementById("message").textContent = texte;
}

function demarrerCamera() {
  afficherMessage("");

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    afficherMessage("A câmara não está disponível neste navegador.");
    return;
  }

  navigator.mediaDevices
    .getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    })
    .then(function (stream) {
      flux = stream;
      var video = document.getElementById("video");
      video.srcObject = stream;
      video.classList.remove("hidden");
      document.getElementById("apercu").classList.add("hidden");
      document.getElementById("etapeCapture").classList.remove("hidden");
      document.getElementById("etapeValidation").classList.add("hidden");
    })
    .catch(function (error) {
      var nom = error && error.name ? error.name : "erro";
      afficherMessage("Não foi possível abrir a câmara (" + nom + ").");
    });
}

function arreterCamera() {
  if (flux) {
    flux.getTracks().forEach(function (piste) {
      piste.stop();
    });
    flux = null;
  }
}

function capturer() {
  var video = document.getElementById("video");

  if (!video.videoWidth) {
    afficherMessage("A câmara ainda não está pronta. Aguarde um instante.");
    return;
  }

  var canvas = document.getElementById("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);

  photo = canvas.toDataURL("image/jpeg", 0.92);

  var apercu = document.getElementById("apercu");
  apercu.src = photo;
  apercu.classList.remove("hidden");
  video.classList.add("hidden");

  document.getElementById("etapeCapture").classList.add("hidden");
  document.getElementById("etapeValidation").classList.remove("hidden");
  afficherMessage("");
}

function utiliser() {
  if (!window.opener) {
    afficherMessage(
      "Não foi possível ligar ao programa. Feche esta janela e tente novamente."
    );
    return;
  }

  window.opener.postMessage(
    { type: "elite-photo", image: photo },
    "*"
  );

  arreterCamera();
  window.close();
}

function repeter() {
  photo = "";
  document.getElementById("apercu").classList.add("hidden");
  document.getElementById("video").classList.remove("hidden");
  document.getElementById("etapeCapture").classList.remove("hidden");
  document.getElementById("etapeValidation").classList.add("hidden");
}

function fermer() {
  arreterCamera();
  window.close();
}

document.getElementById("btnCapturer").onclick = capturer;
document.getElementById("btnUtiliser").onclick = utiliser;
document.getElementById("btnRepeter").onclick = repeter;
document.getElementById("btnFermer").onclick = fermer;
window.addEventListener("beforeunload", arreterCamera);

demarrerCamera();
</script>
</body>
</html>
